<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tareas | Trabajo Final P1</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>

<div class="dashboard-wrapper">
  <header class="top-bar">
    <button class="menu-toggle" id="menu-toggle">
      <span></span>
      <span></span>
    </button>
    <span class="top-bar-title">Gestión de Tareas</span>
  </header>

  <div class="dashboard-body">
    <aside class="sidebar-fixed">
      <nav class="fixed-nav">
        <a th:href="@{/dashboard}" class="square-btn">
          <span class="material-symbols-outlined">dashboard</span>
        </a>
        <a th:href="@{/alojamientos}" class="square-btn">
          <span class="material-symbols-outlined">home</span>
        </a>
        <a th:href="@{/tareas}" class="square-btn active-btn">
          <span class="material-symbols-outlined">event_note</span>
        </a>
        <a th:href="@{/documentos}" class="square-btn">
          <span class="material-symbols-outlined">folder</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <section class="content-area">
        <div class="content-card scrollable-card">

          <div class="task-controls">
            <button class="btn-icon"><span class="material-symbols-outlined">add_box</span></button>
            <button class="btn-action" id="btnNewTask">Nueva Tarea</button>
          </div>

          <div class="kanban-board">

            <div class="kanban-column">
              <h3 class="column-title">Prioridad Alta</h3>

              <div class="task-item task-context" th:each="tarea : ${tareas}" th:if="${tarea.urgencia == 'ALTA'}"
                   th:data-id="${tarea.id}" th:data-titulo="${tarea.titulo}"
                   th:data-urgencia="${tarea.urgencia}" th:data-fecha="${tarea.fechaVencimiento}">

                <form th:action="@{/tareas/completar/{id}(id=${tarea.id})}" method="post" style="margin: 0; display: flex; gap: 10px; align-items: center; width: 100%;">
                  <input type="checkbox" th:checked="${tarea.completada}" onchange="this.form.submit()">
                  <span th:text="${tarea.titulo}" th:style="${tarea.completada ? 'text-decoration: line-through; color: #9ca3af;' : ''}">
        Tarea de prueba
      </span>
                </form>

              </div>
            </div>

            <div class="kanban-column">
              <h3 class="column-title">Prioridad Media</h3>

              <div class="task-item task-context" th:each="tarea : ${tareas}" th:if="${tarea.urgencia == 'MEDIA'}"
                   th:data-id="${tarea.id}" th:data-titulo="${tarea.titulo}"
                   th:data-urgencia="${tarea.urgencia}" th:data-fecha="${tarea.fechaVencimiento}">

                <form th:action="@{/tareas/completar/{id}(id=${tarea.id})}" method="post" style="margin: 0; display: flex; gap: 10px; align-items: center; width: 100%;">
                  <input type="checkbox" th:checked="${tarea.completada}" onchange="this.form.submit()">
                  <span th:text="${tarea.titulo}" th:style="${tarea.completada ? 'text-decoration: line-through; color: #9ca3af;' : ''}">
        Tarea de prueba
      </span>
                </form>

              </div>
            </div>

            <div class="kanban-column">
              <h3 class="column-title">Prioridad Baja</h3>

              <div class="task-item task-context" th:each="tarea : ${tareas}" th:if="${tarea.urgencia == 'BAJA'}"
                   th:data-id="${tarea.id}" th:data-titulo="${tarea.titulo}"
                   th:data-urgencia="${tarea.urgencia}" th:data-fecha="${tarea.fechaVencimiento}">

                <form th:action="@{/tareas/completar/{id}(id=${tarea.id})}" method="post" style="margin: 0; display: flex; gap: 10px; align-items: center; width: 100%;">
                  <input type="checkbox" th:checked="${tarea.completada}" onchange="this.form.submit()">
                  <span th:text="${tarea.titulo}" th:style="${tarea.completada ? 'text-decoration: line-through; color: #9ca3af;' : ''}">
        Tarea de prueba
      </span>
                </form>

              </div>
            </div>

          </div>
          <div class="calendar-section">
            <div class="calendar-nav">
              <button class="btn-nav-cal"><span class="material-symbols-outlined">chevron_left</span></button>
              <h2 class="current-month">Abril 2026</h2>
              <button class="btn-nav-cal"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>

            <div class="calendar-header">
              <div>Lunes</div><div>Martes</div><div>Miércoles</div><div>Jueves</div><div>Viernes</div><div>Sábado</div><div>Domingo</div>
            </div>

            <div class="calendar-grid">

              <div th:each="dia : ${diasCal}" th:class="${dia == null} ? 'cal-day empty' : 'cal-day'">

                <span th:if="${dia != null}" class="day-number" th:text="${dia.numero}">1</span>

                <div th:if="${dia != null && !dia.tareasDelDia.isEmpty()}" class="day-tasks-preview" style="display: flex; flex-direction: column; gap: 3px; margin-top: 5px; width: 100%; padding: 0 5px;">
                  <div th:each="t : ${dia.tareasDelDia}"
                       class="task-dot-label"
                       th:text="${t.titulo}"
                       th:title="${t.titulo}">
                    Tarea
                  </div>
                </div>

              </div>

            </div>

            </div>
          </div>

      
      </section>
    </main>
  </div>

  <div class="slide-menu" id="sidebar">
    <div class="sidebar-header">
      <div class="profile-pic"></div>
      <div class="profile-line"></div>
    </div>
    <div class="sidebar-footer">
      <a th:href="@{/login}" class="btn-off" style="text-decoration: none; text-align: center; display: inline-block;">off</a>
    </div>
  </div>

</div>
<div class="modal-overlay" id="taskModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Crear Nueva Tarea</h3>
      <button class="close-modal" id="closeTaskModal">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="modal-body">
      <form id="newTaskForm" method="post" th:action="@{/tareas/guardar}">

        <input type="hidden" name="id" id="formTaskId">

        <div class="form-group">
          <label>Nombre de la tarea</label>
          <input type="text" name="titulo" id="formTaskTitle" placeholder="Ej: Estudiar para el parcial..." required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Prioridad</label>
            <select name="urgencia" id="formTaskUrgency" required>
              <option value="ALTA">🔴 Alta</option>
              <option value="MEDIA">🟡 Media</option>
              <option value="BAJA">🟢 Baja</option>
            </select>
          </div>
          <div class="form-group">
            <label>Fecha Límite</label>
            <input type="date" name="fechaVencimiento" id="formTaskDate" required>
          </div>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" id="cancelTaskBtn">Cancelar</button>
      <button type="submit" form="newTaskForm" class="btn-primary" style="border:none; cursor:pointer;">Guardar Tarea</button>
    </div>
  </div>
</div>
<div id="customContextMenu" class="context-menu">
  <button id="menuEditBtn" class="menu-action">
    <span class="material-symbols-outlined">edit</span> Editar
  </button>

  <form id="menuDeleteForm" method="post" style="margin: 0;">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <button type="submit" class="menu-action delete-action">
      <span class="material-symbols-outlined">delete</span> Eliminar
    </button>
  </form>
</div>
<script th:src="@{/js/main.js}" src="../static/js/main.js"></script>
</body>
</html>
