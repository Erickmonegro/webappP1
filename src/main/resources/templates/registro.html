<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta | WebAppStudents</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

<div class="auth-container">
  <div class="auth-card">

    <div class="auth-header">
      <h2>Únete a WebAppStudents</h2>
      <p>Crea tu cuenta para empezar a organizar tus tareas.</p>
    </div>

    <form th:action="@{/registro}" th:object="${usuario}" method="POST" class="auth-form">

      <div class="input-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Ana Pérez" required>
      </div>

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" th:field="*{email}" placeholder="tu@correo.com" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" th:field="*{password}" placeholder="Crea una contraseña segura" required>
      </div>

      <button type="submit" class="btn-primary auth-btn">Registrarse</button>

    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
    </div>

  </div>
</div>

</body>
</html>
